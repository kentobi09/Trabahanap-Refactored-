name: ediskarte-stack

services:
  mongodb:
    image: mongo:7.0
    container_name: ediskarte-mongodb
    restart: always
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  ediskarte-server:
    build:
      context: ./ediskarte-server
      dockerfile: Dockerfile
    container_name: ediskarte-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=mongodb://mongodb:27017/ediskarte
      - JWT_SECRET=ediskarte_super_secret_jwt_key_2026
    depends_on:
      mongodb:
        condition: service_healthy

  trabahanap-admin-backend:
    build:
      context: ./trabahanap-admin
      dockerfile: Dockerfile.backend
    container_name: trabahanap-admin-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ediskarte
      - MONGO_DB_NAME=ediskarte
    depends_on:
      mongodb:
        condition: service_healthy

  trabahanap-admin-frontend:
    build:
      context: ./trabahanap-admin
      dockerfile: Dockerfile.frontend
    container_name: trabahanap-admin-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - trabahanap-admin-backend

  ediskarte-client-web:
    build:
      context: ./ediskarte-client
      dockerfile: Dockerfile
    container_name: ediskarte-client-web
    restart: always
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_IP_ADDRESS=localhost
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - ediskarte-server

volumes:
  mongodb_data:
